# Render Blueprint for the dashboard. The service name below sets its default
# address (florida-orange-yield-dashboard.onrender.com). The Python version is
# also shown at the top of the build log.
services:
  - type: web
    name: florida-orange-yield-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:server --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
